# K10 Bot sensorscreen configuration
# Copy to sensorscreen.conf and customize, or pass equivalent --flags on the CLI.

[bot]
bot_ip = 192.168.1.178
bot_port = 24642
bot_token = 6DEE8
bot_timeout = 2.0
udp_fire_and_forget = true
lidar_hz = 8
geomag_hz = 10
imu_hz = 10
huskylens_hz = 10
# IMU bump detection: threshold (50-2000 mg) and debounce (0-2000 ms); firmware defaults shown.
imu_bump_threshold_mg = 2000
imu_bump_debounce_ms = 100

[servos]
# Each channel is fixed as S1 through S6 (firmware channels 0 through 5).
# Valid values: angle180, angle270, continuous.
s1_type = continuous
s2_type = continuous
s3_type = angle270
s4_type = angle270
s5_type = angle270
s6_type = angle270
s4_min_angle = 45
s4_max_angle = 120
s5_min_angle = 140
s5_max_angle = 270

[gamepad]
# Right stick vertical on this controller is exposed as right_stick_x.
left_stick_x  = gamepad_callbacks.set_track_drive(leftchannel=0,rightchannel=1)
left_stick_y  = gamepad_callbacks.set_track_drive(leftchannel=0,rightchannel=1)
left_bumper   = gamepad_callbacks.set_paired_angle(side="left",servonumber=3)
left_trigger  = gamepad_callbacks.set_paired_angle(side="left",servonumber=3)
right_bumper  = gamepad_callbacks.set_paired_angle(side="right",servonumber=4)
right_trigger = gamepad_callbacks.set_paired_angle(side="right",servonumber=4)
button_a      = gamepad_callbacks.set_led(red=0,green=255,blue=0,buttonvalue=$value)
button_b      = gamepad_callbacks.set_led(red=255,green=0,blue=0,buttonvalue=$value)
button_x      = gamepad_callbacks.set_led(red=0,green=0,blue=255,buttonvalue=$value)
button_y      = gamepad_callbacks.set_led(red=255,green=255,blue=0,buttonvalue=$value)
button_guide  = gamepad_callbacks.play_random(filenames="SF_em-disruptor.wav,SF_forcefield.wav,SF_hypergraph.wav,SF_magnetic-tempest.wav,SF_playtime.wav")
pad_up        = gamepad_callbacks.play_random(filenames="mariok_horn-5.wav,mariok_horn-4.wav,mariok_horn-2.wav")
pad_down      = gamepad_callbacks.play_random(filenames="sonic_no.wav,sonic_no-way.wav,sonic_shocked.wav")
pad_left      = gamepad_callbacks.play_random(filenames="homer_quiet-boy.wav,homer_doh.wav,homer_argh.wav")
pad_right     = gamepad_callbacks.play_random(filenames="wario_take-that-loser.wav,wario_i-m-a-gonna-win.wav,wario_ha-ha.wav,wario_ha-ha-ha.wav,wario_aaaaaahhhh.wav")
