[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k10-mecanum-bot"
version = "0.1.0"
description = "Camera and Xbox gamepad controller for a four-servo K10 mecanum bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "pygame>=2.5,<3", "requests>=2.32,<3"]

[project.scripts]
mecanum-bot = "mecanum_control.app:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["mecanum_control"]
package-dir = {mecanum_control = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true