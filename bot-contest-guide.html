<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aMaker Club Contest Guide — K10 Bot</title>
  <base href="/Bot-Contest-2026/">
  <link rel="stylesheet" href="./amaker.css">
  <link rel="stylesheet" href="./contest.css">
</head>
<body>
  <div class="page-shell">

    <div class="docs-nav">
      <a href="bot-contest-guide.html" class="active">aMaker Contest</a>
      <a href="quickstart.html">⚡ Quickstart</a>
      <a href="board-ui.html">📟 Board UI</a>
      <a href="communication.html">📡 Communication</a>
      <a href="binary-protocol.html">🔢 Binary Protocol</a>
      <a href="ai-agent-readme.html">AI Coding References</a>
    </div>

    <section class="hero">
      <div class="hero-copy">
        <p class="hero-kicker">// Official Competition</p>
        <h1>aMaker Bot Contest</h1>
        <p>Current contest rules, supplied hardware, build constraints, safety requirements, and the controller handoff.</p>
        <div class="hero-actions" aria-hidden="true">
          <span>Build</span>
          <span>Code</span>
          <span>Fight</span>
        </div>
      </div>

      <aside class="hero-poster">
        <a href="flyer.png" target="_blank" title="View & Download Official Event Flyer">
          <img src="./flyer.png" alt="aMaker Bot Contest 2026 Official Flyer">
        </a>
      </aside>
    </section>

    <section class="content-frame">
      <div id="md-content" class="loading">Loading guide…</div>
    </section>
  </div>

  <script src="./marked.min.js"></script>
  <script>
    fetch('./bot-contest-guide.md')
      .then(r => r.text())
      .then(md => {
        const target = document.getElementById('md-content');
        target.classList.remove('loading');
        target.innerHTML = marked.parse(md);
      })
      .catch(e => {
        document.getElementById('md-content').innerHTML = '<p style="color:#ff7a8e">Failed to load: ' + e.message + '</p>';
      });
  </script>
</body>
</html>
