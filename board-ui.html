<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/Bot-Contest-2026/">
  <title>Board UI — K10 Bot</title>
  <link rel="stylesheet" href="./amaker.css">
  <link rel="stylesheet" href="./contest.css">
</head>
<body>
  <div class="page-shell">
    <div class="docs-nav">
      <a href="bot-contest-guide.html">aMaker Contest</a>
      <a href="quickstart.html">⚡ Quickstart</a>
      <a href="board-ui.html" class="active">📟 Board UI</a>
      <a href="communication.html">📡 Communication</a>
      <a href="binary-protocol.html">🔢 Binary Protocol</a>
      <a href="ai-agent-readme.html">AI Coding References</a>
    </div>

    <section class="hero">
      <div class="hero-copy">
        <p class="hero-kicker">// CSE Amadeus' aMaker Club</p>
        <h1>Board UI</h1>
        <p>Read the on-device display, cycle status screens, and use the K10 dashboard as your ringside console.</p>
        <div class="hero-actions" aria-hidden="true">
          <span>Watch</span>
          <span>Cycle</span>
          <span>Monitor</span>
          <span>React</span>
        </div>
      </div>

    </section>

    <section class="content-frame">
      <div id="md-content" class="loading">Loading guide…</div>
    </section>
  </div>

  <script src="./marked.min.js"></script>
  <script>
    fetch('./board-ui.md')
      .then(r => r.text())
      .then(md => {
        const target = document.getElementById('md-content');
        target.classList.remove('loading');
        target.innerHTML = marked.parse(md);
      })
      .catch(e => {
        document.getElementById('md-content').innerHTML = '<p style="color:#ff7a8e">Failed to load: ' + e.message + '</p>';
      });
  </script>
</body>
</html>
